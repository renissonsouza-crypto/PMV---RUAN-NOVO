services:
  - type: web
    name: qualificavix-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@qualificavix.local
      - key: ADMIN_PASSWORD
        value: Admin@123456
      - key: UPLOAD_DIR
        value: /tmp/uploads/private/rg
    healthCheckPath: /api/health
